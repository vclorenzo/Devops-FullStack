name: Frontend CI/CD

on:
  # push:
  # branches:
  #   - main
  # paths:
  #   - "docker/app1-hello/node"
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Create .env file for Build
        working-directory: docker/app2-tax-calculator/tax-calculator-frontend
        run: echo "VITE_API_URL=/api" > .env

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "25"

      - name: Install dependencies
        working-directory: docker/app2-tax-calculator/tax-calculator-frontend
        run: npm ci

      - name: Run tests
        working-directory: docker/app2-tax-calculator/tax-calculator-frontend
        run: npm test --if-present

      - name: Build Frontend
        working-directory: docker/app2-tax-calculator/tax-calculator-frontend
        run: npm run build

  docker-build-push:
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: "${{ secrets.DOCKERHUB_USERNAME }}"
          password: "${{ secrets.DOCKERHUB_PASSWORD }}"

      - name: Create env file for Build
        working-directory: docker/app2-tax-calculator/tax-calculator-frontend
        run: echo "VITE_API_URL=/api" > .env

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: docker/app2-tax-calculator/tax-calculator-frontend
          push: true
          tags: "${{ secrets.DOCKERHUB_USERNAME }}/hello-node:latest"
  deploy-aws-eks:
    runs-on: ubuntu-latest
    needs: docker-build-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          aws-region: ap-southeast-2
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig --name hello-cluster --region ap-southeast-2

      - name: Verify connection
        run: kubectl verify nodes

      - name: Deploy to AWS EKS
        run: |
          kubectl apply -f k8s/aws/app2-tax-calculator/frontend
          kubectl apply -f k8s/aws/app2-tax-calculator/ingress.yaml
