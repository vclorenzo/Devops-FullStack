name: Contexts CI
run-name: ${{ github.actor }}'s CI

on:
  push:

env:
  GLOBAL_APP_ENV: global-dev

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JOB_ENV: job-dev
    steps:
      - name: Say Hello
        run: echo "Hello, world!"

      - name: Echo Environment Variable
        env:
          APP_ENV: dev
          DB_PASSWORD: "${{ secrets.DB_PASSWORD }}"
        run: 'echo "ENVIRONMENT $APP_ENV using SECRET_NAME: $DB_PASSWORD, $GLOBAL_APP_ENV, $JOB_ENV"'

      - name: Contexts
        run: |
          echo "GITHUB_EVENT_NAME: ${{ github.event_name }}"
          echo "Runner OS: ${{ runner.os }}"
          echo "GITHUB_EVENT_PATH: ${{ github.event_path }}"
          echo "GITHUB_WORKFLOW: ${{ github.workflow }}"
          echo "GITHUB_ACTOR: ${{ github.actor }}"
          echo "GITHUB_REPOSITORY: ${{ github.repository }}"
          echo "GITHUB_WORKSPACE: ${{ github.workspace }}"
          echo "JOB_STATUS: ${{ job.status }}"

      - name: Create demo file
        run: |
          echo "Hello from CI Pipeline" > demo.txt
          echo "File created successfully"
      - name: Upload Demo
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts-demo
          path: .
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Test Job
        run: echo "Test Job"
