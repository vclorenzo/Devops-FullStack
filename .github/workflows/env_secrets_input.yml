name: Environment Secrets Input

on:
  push:

env:
  GLOBAL_APP_ENV: global-dev

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JOB_ENV: job-dev
    steps:
      - name: Say Hello
        run: echo "Hello, world!"

      - name: Echo Environment Variable
        env:
          APP_ENV: dev
          DB_PASSWORD: "${{ secrets.DB_PASSWORD }}"
        run: 'echo "ENVIRONMENT $APP_ENV using SECRET_NAME: $DB_PASSWORD, $GLOBAL_APP_ENV, $APP_ENV"'
