name: Environment Secrets Input

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Say Hello
        run: echo "Hello, world!"

      - name: Echo Environment Variable
        env:
          APP_ENV: dev
          DB_PASSWORD: "${{ secrets.DB_PASSWORD }}"
        run: 'echo "ENVIRONMENT $APP_ENV using SECRET_NAME: $DB_PASSWORD"'
